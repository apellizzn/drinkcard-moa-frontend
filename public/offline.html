<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e30613" />
    <title>Sin conexión — DrinkCard MOA</title>
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, "Helvetica Neue", Arial,
          sans-serif;
        background: #fafaf6;
        color: #0a0a0a;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        min-height: 100vh;
        min-height: 100dvh;
      }
      .card {
        max-width: 28rem;
        width: 100%;
        text-align: center;
      }
      .badge {
        display: inline-block;
        background: #e30613;
        color: #fff;
        font-weight: 800;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 6px 12px;
        border-radius: 999px;
        transform: rotate(-3deg);
      }
      h1 {
        font-family: "Archivo Black", "Arial Black", sans-serif;
        font-size: clamp(2.5rem, 8vw, 4rem);
        line-height: 0.95;
        margin: 16px 0 8px;
        letter-spacing: -0.02em;
      }
      h1 .accent {
        color: #e30613;
      }
      p {
        color: #525252;
        font-size: 1rem;
        line-height: 1.5;
        margin: 0 0 24px;
      }
      button {
        appearance: none;
        border: none;
        background: #e30613;
        color: #fff;
        font-family: inherit;
        font-weight: 700;
        font-size: 1rem;
        letter-spacing: 0.02em;
        padding: 12px 24px;
        border-radius: 16px;
        cursor: pointer;
        box-shadow: 0 6px 0 0 rgba(0, 0, 0, 0.85);
        transition: transform 120ms ease;
      }
      button:hover {
        transform: translateY(-1px);
      }
      button:active {
        transform: translateY(2px);
        box-shadow: 0 2px 0 0 rgba(0, 0, 0, 0.85);
      }
      .icon {
        width: 72px;
        height: 72px;
        border-radius: 16px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="icon" src="/icons/icon-192.png" alt="DrinkCard MOA" />
      <div style="margin-top: 12px">
        <span class="badge" data-i18n="badge">Sin conexión</span>
      </div>
      <h1 data-i18n-html="heading">Estás <span class="accent">offline</span></h1>
      <p data-i18n="body">
        No podemos conectar con el servidor. Comprueba tu conexión y reintenta — tu saldo y tus QR
        siempre se cargan en directo para evitar errores en barra.
      </p>
      <button onclick="location.reload()" data-i18n="retry">Reintentar</button>
    </div>
    <script>
      const translations = {
        es: {
          lang: "es",
          title: "Sin conexión — DrinkCard MOA",
          badge: "Sin conexión",
          heading: 'Estás <span class="accent">offline</span>',
          body: "No podemos conectar con el servidor. Comprueba tu conexión y reintenta — tu saldo y tus QR siempre se cargan en directo para evitar errores en barra.",
          retry: "Reintentar",
        },
        it: {
          lang: "it",
          title: "Senza connessione — DrinkCard MOA",
          badge: "Senza connessione",
          heading: 'Sei <span class="accent">offline</span>',
          body: "Non riusciamo a connetterci al server. Controlla la connessione e riprova — saldo e QR vengono sempre caricati in tempo reale per evitare errori al bar.",
          retry: "Riprova",
        },
        fr: {
          lang: "fr",
          title: "Hors ligne — DrinkCard MOA",
          badge: "Hors ligne",
          heading: 'Tu es <span class="accent">hors ligne</span>',
          body: "Impossible de se connecter au serveur. Vérifie ta connexion et réessaie — ton solde et tes QR sont toujours chargés en direct pour éviter les erreurs au bar.",
          retry: "Réessayer",
        },
        en: {
          lang: "en",
          title: "Offline — DrinkCard MOA",
          badge: "Offline",
          heading: 'You are <span class="accent">offline</span>',
          body: "We cannot connect to the server. Check your connection and try again — your balance and QRs always load live to avoid bar errors.",
          retry: "Retry",
        },
      };
      const storedLanguage = localStorage.getItem("drinkcard.language");
      const copy = translations[storedLanguage] ?? translations.es;
      document.documentElement.lang = copy.lang;
      document.title = copy.title;
      document.querySelectorAll("[data-i18n]").forEach((element) => {
        element.textContent = copy[element.dataset.i18n];
      });
      document.querySelectorAll("[data-i18n-html]").forEach((element) => {
        element.innerHTML = copy[element.dataset.i18nHtml];
      });
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
