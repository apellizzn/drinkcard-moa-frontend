services:
  drinkcard-front:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: drinkcard-front
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: ""
      VITE_API_PROXY_TARGET: "http://host.docker.internal:8080"
      VITE_ALLOWED_HOSTS: "uncharted-apply-upstart.ngrok-free.dev"
    volumes:
      - .:/app
      - drinkcard_front_node_modules:/app/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  drinkcard_front_node_modules:
